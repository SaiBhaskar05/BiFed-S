<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24/7 Biometric Attendance Kiosk Terminal</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/kiosk.css">
  <script src="/static/js/sounds.js"></script>
  <script src="/static/js/kiosk.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="kiosk-body" data-device-name="{{ kiosk.name }}">
  
  <!-- Kiosk Top Header Bar -->
  <header class="kiosk-header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #06b6d4, #3b82f6); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 0 14px var(--cyan-glow);">
        <i data-lucide="scan-face" style="width: 20px;"></i>
      </div>
      <div>
        <div style="font-weight: 800; font-size: 1.1rem; letter-spacing: -0.3px;">{{ kiosk.name }}</div>
        <div style="font-size: 0.75rem; color: var(--text-dim);"><i data-lucide="map-pin" style="width: 12px; display: inline;"></i> {{ kiosk.location }}</div>
      </div>
      <div class="kiosk-badge">
        <span class="pulse-dot"></span>
        <span>CONTINUOUS SCANNING ACTIVE</span>
      </div>
    </div>

    <!-- Live Digital Clock & Controls -->
    <div style="display: flex; align-items: center; gap: 20px;">
      <div style="text-align: right;">
        <div id="kioskClock" style="font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; color: #38bdf8;">--:--:--</div>
        <div id="kioskDate" style="font-size: 0.75rem; color: var(--text-muted);">--</div>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="toggleFullscreen()" title="Toggle Fullscreen" style="padding: 8px 12px;">
          <i data-lucide="maximize" style="width: 16px;"></i>
        </button>
        <a href="/kiosk/logout" class="btn btn-secondary" style="padding: 8px 12px; color: var(--danger);" title="Exit Kiosk Mode">
          <i data-lucide="power" style="width: 16px;"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Kiosk Interface -->
  <main class="kiosk-main-grid">
    <!-- Camera Feed and Biometric HUD -->
    <div class="kiosk-scanner-container">
      <video id="kioskVideo" autoplay playsinline muted></video>
      <canvas id="kioskCanvas"></canvas>

      <!-- Sci-Fi Corner Brackets -->
      <div class="hud-corner tl"></div>
      <div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div>
      <div class="hud-corner br"></div>

      <!-- Center Targeting Oval -->
      <div id="centerTarget" class="hud-center-target"></div>

      <!-- Live Voice & Instruction Banner -->
      <div class="hud-instruction-banner">
        <span class="pulse-dot"></span>
        <span id="instructionText">Please Look at the Camera</span>
      </div>

      <!-- Biometric Verification Result Modal (Animated Overlay) -->
      <div id="matchResultCard" class="match-result-card">
        <img id="matchAvatar" src="" class="match-avatar" alt="User Profile">
        <h2 id="matchName" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 4px;">--</h2>
        <div id="matchEmpId" style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px;">--</div>
        <div id="matchDept" style="font-size: 0.88rem; color: #93c5fd; margin-bottom: 16px;">--</div>
        
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 14px;">
          <span id="matchStatusBadge" class="badge badge-present">PRESENT</span>
        </div>
        
        <div id="matchScoreText" style="font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono);">
          Match: 95% • PAD: 98%
        </div>
      </div>
    </div>

    <!-- Right Sidebar: Today's Live Attendance Feed -->
    <aside class="clay-card kiosk-sidebar">
      <div class="kiosk-feed-header">
        <div>
          <div style="font-weight: 700; font-size: 1rem;">Today's Check-ins</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Real-time biometric attendance stream</div>
        </div>
        <span id="todayAttendeeCount" class="badge badge-present">0</span>
      </div>

      <div id="kioskFeedList" class="kiosk-feed-list">
        <!-- Live items dynamically appended -->
      </div>
    </aside>
  </main>

</body>
</html>
