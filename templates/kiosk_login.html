<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Terminal Login | Continuous Attendance</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/sounds.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-wrapper">
    <a href="/" style="position: absolute; top: 28px; left: 28px; color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem;">
      <i data-lucide="arrow-left" style="width: 18px;"></i>
      <span>Back to Portals</span>
    </a>

    <div class="glass-panel auth-card" style="max-width: 420px;">
      <div class="auth-header">
        <div class="portal-icon-wrapper" style="background: rgba(6, 182, 212, 0.1); border-color: rgba(6, 182, 212, 0.3); color: var(--cyan); margin: 0 auto 16px auto;">
          <i data-lucide="scan"></i>
        </div>
        <h1 class="auth-title">Kiosk Terminal Access</h1>
        <p class="auth-subtitle">Enter Kiosk Device PIN code to activate 24/7 attendance scanning</p>
      </div>

      <form id="kioskLoginForm">
        <div class="form-group" style="text-align: center;">
          <label class="form-label" for="pinCode">Enter 4-Digit Terminal PIN</label>
          <input type="password" id="pinCode" class="form-control" placeholder="••••" maxlength="6" style="text-align: center; font-size: 1.8rem; letter-spacing: 12px; font-family: var(--font-mono); height: 56px;" required autofocus>
        </div>

        <div id="errorMsg" style="display: none; padding: 10px 14px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius-sm); color: #fca5a5; font-size: 0.85rem; margin-bottom: 16px; text-align: center;"></div>

        <!-- Touch / On-screen Keypad -->
        <div class="pin-keypad">
          <button type="button" class="pin-btn" onclick="pressKey('1')">1</button>
          <button type="button" class="pin-btn" onclick="pressKey('2')">2</button>
          <button type="button" class="pin-btn" onclick="pressKey('3')">3</button>
          <button type="button" class="pin-btn" onclick="pressKey('4')">4</button>
          <button type="button" class="pin-btn" onclick="pressKey('5')">5</button>
          <button type="button" class="pin-btn" onclick="pressKey('6')">6</button>
          <button type="button" class="pin-btn" onclick="pressKey('7')">7</button>
          <button type="button" class="pin-btn" onclick="pressKey('8')">8</button>
          <button type="button" class="pin-btn" onclick="pressKey('9')">9</button>
          <button type="button" class="pin-btn" style="color: var(--danger);" onclick="clearPin()">C</button>
          <button type="button" class="pin-btn" onclick="pressKey('0')">0</button>
          <button type="button" class="pin-btn" style="color: var(--cyan);" onclick="backspacePin()">⌫</button>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-cyan" style="width: 100%; height: 48px; margin-top: 20px;">
          <span>Start Attendance Scanning</span>
          <i data-lucide="play" style="width: 16px;"></i>
        </button>
      </form>

      <div style="margin-top: 20px; text-align: center; font-size: 0.82rem; color: var(--text-dim);">
        Default Terminal PIN: <span style="color: var(--cyan); font-family: var(--font-mono);">1234</span>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const pinInput = document.getElementById("pinCode");

    function pressKey(num) {
      if (pinInput.value.length < 6) {
        pinInput.value += num;
        window.sounds.playBeep(900, 0.05);
      }
    }

    function clearPin() {
      pinInput.value = "";
      window.sounds.playBeep(400, 0.05);
    }

    function backspacePin() {
      pinInput.value = pinInput.value.slice(0, -1);
      window.sounds.playBeep(600, 0.05);
    }

    document.getElementById("kioskLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errBox = document.getElementById("errorMsg");
      const pin = pinInput.value.trim();

      if (!pin) return;

      btn.disabled = true;
      btn.innerHTML = `Connecting Kiosk...`;
      errBox.style.display = "none";

      try {
        const res = await fetch("/api/kiosk/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin_code: pin })
        });
        const data = await res.json();
        if (data.success) {
          window.sounds.playSuccess();
          window.location.href = data.redirect || "/kiosk/scanner";
        } else {
          window.sounds.playError();
          errBox.textContent = data.message || "Invalid Terminal PIN";
          errBox.style.display = "block";
          btn.disabled = false;
          btn.innerHTML = `<span>Start Attendance Scanning</span> <i data-lucide="play" style="width: 16px;"></i>`;
          lucide.createIcons();
        }
      } catch (err) {
        errBox.textContent = "Cannot connect to attendance server";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.innerHTML = `<span>Start Attendance Scanning</span> <i data-lucide="play" style="width: 16px;"></i>`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
